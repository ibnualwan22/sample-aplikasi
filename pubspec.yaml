name: sample_aplikasi
description: "Aplikasi Markaz Arabiyah dengan portal SIAKAD santri"
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.1
  intl: ^0.20.2
  adhan: ^2.0.0
  geolocator: ^13.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  table_calendar: ^3.1.3
  webview_flutter: ^4.13.1
  shorebird_code_push: ^2.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_qiblah: ^3.1.0+1
  permission_handler: ^12.0.1
  webview_flutter_android: ^4.12.0
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_html: ^3.0.0
  flutter_svg: ^2.0.0
  html: 0.15.6
  image: 4.8.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  assets:
    - .env
    - shorebird.yaml
    - assets/quran_index.json
    - assets/mascot/
    - assets/icons/
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: STIXTwoText
      fonts:
        - asset: assets/fonts/STIXTwoText.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
